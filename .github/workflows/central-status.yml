# Read-only: asks Maven Central what state each recent deployment is in (it changes nothing).
name: central-status
on:
  push:
    branches: ["claude/project-thread-t8g9bm"]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment states
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          for pair in 0.1.158=d9a31049-592f-47ec-bf7f-f1d56d9b6de0 0.1.159=ec6037fc-4e3d-4bb8-835f-2f7dd2c1d4d9 0.1.160=f676caf7-17ab-466a-88b2-346a3f83cdb3 0.1.161=774c6ac2-afa6-46cd-a356-7867a599167d 0.1.162=e6e22d62-e7d2-428c-8eff-9f00bad81c81 0.1.164=e0fe6fa1-9516-4508-bf12-fa5f084dbf97; do
            v=${pair%%=*}; id=${pair#*=}
            echo "== $v $id"
            curl -s -X POST -H "Authorization: Bearer $token" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -c '{deploymentState, purls, errors}' || true
          done
